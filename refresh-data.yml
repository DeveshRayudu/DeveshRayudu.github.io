# Keeps the portfolio's GitHub data (projects and contribution graph) fresh.
# Runs every 30 minutes, and on demand from the Actions tab (Run workflow).
# It only commits when something actually changed.
name: Refresh GitHub data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_snapshot.py

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/snapshot.js; then
            echo "Nothing changed."
            exit 0
          fi
          version=$(date -u +%Y%m%d%H%M)
          sed -i -E "s/\\?v=[0-9A-Za-z]+\"/?v=${version}\"/g" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.js index.html
          git commit -m "Refresh GitHub data"
          git pull --rebase
          git push
